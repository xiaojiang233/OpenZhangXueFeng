[project]
name = "open-zhangxuefeng"
version = "2.0.0"
description = "AI education and career consultation with streaming chat, search, and voice."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "msgpack>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<10.0"]

[tool.uv]
package = false
required-version = ">=0.6.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
